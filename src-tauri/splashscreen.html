<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Foccus</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            width: 100vw;
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            overflow: hidden;
        }

        .logo-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 24px;
        }

        .logo {
            width: 128px;
            height: 128px;
            background-image: url('icons/128x128.png');
            background-size: contain;
            background-repeat: no-repeat;
            background-position: center;
            animation: pulse 2s ease-in-out infinite;
        }

        .app-name {
            font-size: 48px;
            font-weight: 700;
            color: white;
            letter-spacing: -1px;
            text-shadow: 0 2px 10px rgba(0, 0, 0, 0.2);
        }

        .tagline {
            font-size: 18px;
            color: rgba(255, 255, 255, 0.9);
            font-weight: 400;
            margin-top: -12px;
        }

        .loader {
            margin-top: 40px;
            width: 200px;
            height: 4px;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 2px;
            overflow: hidden;
        }

        .loader-bar {
            height: 100%;
            background: white;
            border-radius: 2px;
            animation: load 1.5s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% {
                transform: scale(1);
                opacity: 1;
            }
            50% {
                transform: scale(1.05);
                opacity: 0.9;
            }
        }

        @keyframes load {
            0% {
                width: 0%;
                margin-left: 0%;
            }
            50% {
                width: 50%;
                margin-left: 25%;
            }
            100% {
                width: 0%;
                margin-left: 100%;
            }
        }
    </style>
</head>
<body>
    <div class="logo-container">
        <div class="logo"></div>
        <h1 class="app-name">Foccus</h1>
        <p class="tagline">Pomodoro Timer</p>
        <div class="loader">
            <div class="loader-bar"></div>
        </div>
    </div>
</body>
</html>
